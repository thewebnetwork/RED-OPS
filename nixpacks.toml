# Pin nixpacks build behavior to recover from May 2 Railway deploy outage.
# Without this, NIXPACKS auto-detects Python config and the auto-detected
# behavior changed at some point between Apr 26 and May 2 2026, breaking
# every subsequent deploy.

[phases.setup]
nixPkgs = [
  "python311",
  "gcc",
  "libffi",
  "openssl",
  "libjpeg",
  "zlib",
  "rustc",
  "cargo",
  "pkg-config",
]
aptPkgs = [
  "build-essential",
  "libssl-dev",
  "libffi-dev",
]

[phases.install]
cmds = [
  "python --version",
  "pip install --upgrade pip setuptools wheel",
  "pip install --no-cache-dir -r backend/requirements.txt",
]

# NOTE: do NOT add a [phases.build] step that imports the app —
# database.py instantiates the Motor client at import time, which means
# any `python -c 'import server_v2'` smoke test during build will hang
# waiting for MongoDB (no MONGO_URL env at build phase). Smoke tests
# belong post-deploy via /api/health, not in nixpacks.

[start]
cmd = "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONUNBUFFERED = "1"
PIP_NO_CACHE_DIR = "1"
