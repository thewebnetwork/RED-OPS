# Minimal NIXPACKS config — let auto-detection handle Python build.
#
# History:
# - Apr 26 2026: deploys worked with NO nixpacks.toml + railway.json
#   buildCommand "pip install -r backend/requirements.txt"
# - May 2 2026: NIXPACKS upstream change broke nested-dir scanning. Every
#   deploy failed with "backend/requirements.txt not found" at install.
# - May 7 2026: requirements.txt moved to repo root + railway.json
#   buildCommand removed. Install now works from root.
# - May 7 2026 v2: explicit [phases.install] in earlier nixpacks.toml
#   bypassed NIXPACKS' default `COPY . .` — runtime image was missing
#   backend/. Stripped down to env vars only so auto-detection runs the
#   standard Python flow (setup → install → COPY . . → start).
#
# Start command lives in railway.json (`cd backend && uvicorn server:app`).
# DO NOT add [phases.install] or [phases.build] without confirming backend/
# is still in the runtime image (check deploy logs for "cd: backend: No
# such file or directory").

[variables]
PYTHONUNBUFFERED = "1"
PIP_NO_CACHE_DIR = "1"
